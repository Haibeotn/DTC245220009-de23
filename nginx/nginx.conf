events {
    worker_connections 1024;
}

http {
    # Hardening: Ẩn thông tin phiên bản Nginx
    server_tokens off;

    upstream gym_backend {
        server gym-web:3000;
    }

    # Tự động chuyển hướng HTTP (cổng 80) sang HTTPS (cổng 443)
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Cấu hình HTTPS và Security Headers
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/ssl/gym.crt;
        ssl_certificate_key /etc/nginx/ssl/gym.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Hardening: Các Security Headers bảo vệ trình duyệt
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://gym_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
